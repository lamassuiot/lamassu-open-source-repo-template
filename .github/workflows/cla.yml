name: CLA Assistant

# Disabled by default: CLA.md is a structural placeholder pending legal review (see the
# comment at the top of that file). Set the repository/organization variable
# CLA_ENABLED to "true" only after CLA.md has been finalized by legal counsel and the
# path-to-document URL below has been updated to point at this repository.
#
# NOTE: contributor-assistant/github-action is archived/unmaintained upstream. This workflow
# pins the last released tag (v2.6.1) so it keeps working, but it will not receive further
# security fixes. Re-evaluate this dependency before enabling in production.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    if: vars.CLA_ENABLED == 'true' && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' || github.event_name == 'pull_request_target')
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          # Replace REPLACE_WITH_REPO once this template is used to create a real repository.
          path-to-document: "https://github.com/lamassuiot/REPLACE_WITH_REPO/blob/main/CLA.md"
          branch: "main"
          allowlist: dependabot[bot],bot*
