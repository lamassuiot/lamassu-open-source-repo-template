name: Lint PR Title

# Enforces Conventional Commits on pull request titles. This matters most if the repository
# squash-merges pull requests, since the PR title becomes the commit subject.

on:
  # Use pull_request_target so title validation also runs for pull requests from forks.
  # This workflow is read-only and must never check out or execute contributor-controlled code.
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    name: Validate PR title format
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        # v6.1.1; pin to an immutable commit for supply-chain safety.
        uses: amannn/action-semantic-pull-requests@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
