version: 2
updates:
  # Keep GitHub Actions workflows up to date.
  # NOTE: This repository template does not include an application source tree,
  # so only the GitHub Actions ecosystem is configured here. Add additional
  # `package-ecosystem` entries (e.g. npm, gomod, pip, docker) once the project's
  # actual language/package manager is known.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
