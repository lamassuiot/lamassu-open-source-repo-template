name: "🐛 Bug"
description: Report a reproducible problem with the project.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        ⚠️ **Do not include credentials, tokens, private keys, customer data, or other confidential information in this issue.**
        If you believe this is a security vulnerability, please follow the process in [SECURITY.md](../../SECURITY.md) instead of filing a public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short, clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Version, OS, browser, deployment method, etc.
      placeholder: e.g. v1.2.3, Ubuntu 22.04, Docker
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: |
        Add any relevant logs, stack traces, or screenshots.
        ⚠️ Redact secrets, tokens, private keys, and any customer-identifiable information before pasting.
      render: shell
    validations:
      required: false
