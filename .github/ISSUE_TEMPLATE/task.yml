name: "📋 Task"
description: Define a concrete, actionable unit of implementation work.
title: "[Task]: "
labels:
  - task
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a task!

        ⚠️ **Do not include credentials, tokens, private keys, customer data, or other confidential information in this issue.**
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What is this task trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and out of scope for this task?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What conditions must be met for this task to be considered done?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to related issues, discussions, or public documentation (public URLs only).
    validations:
      required: false
